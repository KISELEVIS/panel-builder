<svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон (темный, как в интерфейсе) -->
  <rect width="100" height="100" rx="20" fill="#1e293b" />

  <!-- Тень под автоматом -->
  <rect x="22" y="20" width="56" height="64" rx="4" fill="#000" opacity="0.4" />

  <!-- Корпус автомата (белый/серый) -->
  <rect x="22" y="16" width="56" height="64" rx="3" fill="#f1f5f9" />

  <!-- Вертикальные разделители полюсов -->
  <line x1="40.6" y1="16" x2="40.6" y2="80" stroke="#cbd5e1" stroke-width="2" />
  <line x1="59.3" y1="16" x2="59.3" y2="80" stroke="#cbd5e1" stroke-width="2" />

  <!-- Верхние винты -->
  <circle cx="31" cy="26" r="5" fill="#334155" />
  <circle cx="50" cy="26" r="5" fill="#334155" />
  <circle cx="69" cy="26" r="5" fill="#334155" />

  <!-- Нижние винты -->
  <circle cx="31" cy="70" r="5" fill="#334155" />
  <circle cx="50" cy="70" r="5" fill="#334155" />
  <circle cx="69" cy="70" r="5" fill="#334155" />

  <!-- Желтая полоса -->
  <rect x="22" y="35" width="56" height="6" fill="#facc15" />

  <!-- Красные индикаторы -->
  <rect x="43" y="45" width="7" height="4" rx="2" fill="#ef4444" />
  <rect x="62" y="45" width="7" height="4" rx="2" fill="#ef4444" />
  <rect x="26" y="45" width="7" height="4" rx="2" fill="#ef4444" />

  <!-- Желтые рычажки (переключатели) -->
  <!-- Рычажок 1 -->
  <rect x="26" y="54" width="10" height="12" rx="2" fill="#eab308" />
  <rect x="26" y="54" width="10" height="3" fill="#fef08a" opacity="0.6" />

  <!-- Рычажок 2 -->
  <rect x="45" y="54" width="10" height="12" rx="2" fill="#eab308" />
  <rect x="45" y="54" width="10" height="3" fill="#fef08a" opacity="0.6" />

  <!-- Рычажок 3 -->
  <rect x="64" y="54" width="10" height="12" rx="2" fill="#eab308" />
  <rect x="64" y="54" width="10" height="3" fill="#fef08a" opacity="0.6" />
</svg>
